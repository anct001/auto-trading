[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-crypto-trading-agent"
version = "0.6.0"
description = "Solo-operator, paper-first, phase-gated automated crypto-trading system (see docs/MASTER_DRIVER.md)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "anct001" }]

# Runtime deps grow slice-by-slice (§7 / PLAN.md). P0 data harness needs:
#   ccxt    — exchange connectivity + OHLCV (§2, §9)
#   pandas  — OHLCV frames (single feature path, §15)
#   pyarrow — Parquet store (§2)
#   numpy   — indicator math (§15)
# Freqtrade/vectorbt/ollama enter in later slices/phases.
dependencies = [
  "ccxt>=4.5,<5",
  "pandas>=2.2",
  "pyarrow>=15",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff",
  "mypy",
]

# Beginner-friendly console commands (installed by `pip install -e .`):
#   autotrader     — the paper dry-run / replay CLI (same flags as `python -m src.dry_run`)
#   autotrader-ui  — the read-only operator dashboard on a demo snapshot
[project.scripts]
autotrader = "src.dry_run:main"
autotrader-ui = "src.ui.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
